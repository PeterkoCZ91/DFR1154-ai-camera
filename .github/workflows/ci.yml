name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A push dropped during an Actions outage leaves that commit unverified with
  # nothing to re-run, since a run is only created in response to an event.
  workflow_dispatch:

jobs:
  a12:
    name: A12 companion (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            a12_system/requirements.txt
            a12_system/requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # face_recognition is deliberately excluded: it needs dlib, which
          # takes minutes to build and is optional at runtime. The tests that
          # touch it are skipped when the import fails, exactly as on a Pi.
          pip install -r a12_system/requirements.txt
          pip install -r a12_system/requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest -q

  firmware:
    name: Firmware (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The toolchain and the arduino-esp32 package are ~500 MB and change only
      # when platformio.ini pins a different version.
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      # Only the one environment: `ota` extends it and overrides nothing but
      # upload_protocol/upload_port/upload_command, so it compiles the identical
      # objects for twice the wall clock. If `ota` ever gains a build_flag,
      # build it here too.
      # Before compiling, not after: the arrays are what gets served, so a page
      # edited in firmware/web/ without re-embedding would otherwise build
      # green and ship the old UI.
      - name: Web assets match their source
        run: python3 tools/build_web_assets.py --check

      - name: Build
        working-directory: firmware
        run: ../.github/scripts/build-firmware.sh esp32-s3-devkitc-1
