[platformio]
src_dir = .
include_dir = ../../include
lib_dir = lib

[env:esp32-s3-devkitc-1]
; pinned to local platformio platform install (was: github default branch)
; — fixes broken include paths after global ~/.platformio/platforms/espressif32
;   was overwritten by pioarduino during a Tier 2 F exploration session
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
build_src_filter = +<*> -<lib/>
build_flags =
    -DINCLUDE_TELEGRAM
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; ESP-NN: enabled with TFLite Micro export (non-EON). EON export corrupted heap — see CHANGELOG.
    -DEI_CLASSIFIER_TFLITE_ENABLE_ESP_NN=1
    -DEI_PORTING_ARDUINO=1
    ; Single source of truth for the firmware version string. Update here
    ; (and in CHANGELOG/git tag) instead of editing main.cpp.
    '-DFIRMWARE_VERSION="3.12.44 (bg learning fix, person_tg off on A12 cam)"'
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#3.0.0
    framework-arduinoespressif32-libs @ https://github.com/espressif/arduino-esp32/releases/download/3.0.0/esp32-arduino-libs-3.0.0.zip
lib_deps =
    espressif/esp32-camera @ ^2.0.4
    bblanchon/ArduinoJson @ ^6.21.3
    ; ESP32-RTSPServer je v lib/ (lokální kopie s optimalizacemi)
    knolleary/PubSubClient @ ^2.8

; --- OTA Upload ---
; HTTP OTA: pio run -e ota -t upload
; Camera must be on WiFi. Set upload_port to your camera IP.
; Default credentials are admin:admin — change via /credentials endpoint first.
[env:ota]
extends = env:esp32-s3-devkitc-1
upload_protocol = custom
upload_port = 192.168.1.100  ; ← change to your camera's IP
upload_command = curl -v -u admin:admin --data-binary @${SOURCE} http://${UPLOAD_PORT}/update

